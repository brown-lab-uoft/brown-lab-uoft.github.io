# ============================================================
# STEP 1: Your Identity (required)
# ============================================================
name: "Brown Lab at UofT"
pi_name: "Joseph S. Brown"
title: "Assistant Professor"
institution: "University of Toronto"
email: js.brown@utoronto.ca
photo: headshot.jpg  # place your photo in images/

# ============================================================
# STEP 2: Your Links (optional -- delete any you don't use)
# ============================================================
links:
  google_scholar: "https://scholar.google.com/citations?user=TTnfnugAAAAJ"
  orcid: "https://orcid.org/0000-0002-8145-800X"
  linkedin: "https://www.linkedin.com/in/joseph-brown-15b260131/"
  cv: ""  # e.g., "papers/cv.pdf" — leave blank to hide the CV icon

# ============================================================
# STEP 3: Site Settings
# ============================================================
# Theme color for links, chips, and buttons. This is injected as a CSS custom property
# override in _includes/head.html *after* main.css loads, so it always wins over the
# --accent default baked into _sass/base/_variables.scss — keep the two in sync (or you'll
# get the surprise this comment is here to prevent: change one, the site doesn't visibly
# change, because the other one is still winning the cascade).
accent_color: "#3a6b91"
dark_mode: true              # show dark mode toggle in navbar
# Sitewide fallback meta description — shown in search results for any page that
# doesn't set its own `description:` in front matter. Keep this keyword-rich since
# it's also the fallback og:description/twitter:description (see _includes/head.html).
description: "The Brown Lab at the University of Toronto builds a self-driving laboratory for peptide drug discovery, combining affinity-selection mass spectrometry (AS-MS), automated peptide synthesis, and active learning to design antimicrobial peptides against drug-resistant infections."
baseurl: ""
url: "https://brown-lab-uoft.github.io"
lang: "en-CA"                # drives <html lang> in _layouts/default.html

# Google Analytics — paste your GA4 measurement ID, or leave blank
analytics:
  google_id: ""

# Lab mailing address — single source of truth for the homepage Contact Us section
# and the keyless Google Maps embed (built from these fields in _pages/home.md).
# Update here if the lab ever moves; nothing else needs to change.
address:
  building: "Leslie Dan Faculty of Pharmacy"
  street: "144 College Street"
  city: "Toronto"
  region: "ON"
  postal_code: "M5S 3M2"
  country: "Canada"

# ============================================================
# STEP 4: Choose Your Pages (comment out any you don't need)
# ============================================================
nav_pages:
  - name: about
  - name: publications
  - name: research
  - name: team
  - name: repositories
  - name: gallery
  - name: news

# ============================================================
# Advanced Settings (you probably don't need to change these)
# ============================================================
include:
  - .htaccess
  - _pages

sass:
  quiet_deps: true
  style: compressed

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true

plugins: ["jekyll/scholar", "jekyll-sitemap"]

scholar:
  last_name: Brown
  first_name: [Joseph]
  style: citesty
  locale: en
  source: /assets/
  bibliography: ref.bib
  bibliography_template: bibtemplate
  sort_by: year, month
  order: descending
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details
  query: "@*"
  bibliography_list_attributes:
    reversed: "reversed"

exclude:
  - Gemfile
  - Gemfile.lock
  - update_bootstrap.sh
  - switch_theme.sh
  - tags
  - Rakefile
  - node_modules
  - package.json
  - package-lock.json
  - docs
