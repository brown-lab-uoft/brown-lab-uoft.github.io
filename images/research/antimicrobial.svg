<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <rect width="400" height="200" fill="#f0ece4"/>

  <!-- Bacterial interior -->
  <rect x="0" y="120" width="400" height="80" fill="#b45309" opacity="0.07"/>

  <!-- Phospholipid bilayer: outer leaflet heads -->
  <circle cx="20" cy="107" r="6" fill="#1a7a6d" opacity="0.55"/>
  <circle cx="48" cy="107" r="6" fill="#1a7a6d" opacity="0.55"/>
  <circle cx="76" cy="107" r="6" fill="#1a7a6d" opacity="0.55"/>
  <circle cx="104" cy="107" r="6" fill="#1a7a6d" opacity="0.55"/>
  <circle cx="132" cy="107" r="6" fill="#1a7a6d" opacity="0.55"/>
  <circle cx="160" cy="107" r="6" fill="#1a7a6d" opacity="0.55"/>
  <circle cx="188" cy="107" r="6" fill="#1a7a6d" opacity="0.55"/>
  <circle cx="216" cy="107" r="6" fill="#1a7a6d" opacity="0.55"/>
  <circle cx="244" cy="107" r="6" fill="#1a7a6d" opacity="0.55"/>
  <circle cx="272" cy="107" r="6" fill="#1a7a6d" opacity="0.55"/>
  <circle cx="300" cy="107" r="6" fill="#1a7a6d" opacity="0.55"/>
  <circle cx="328" cy="107" r="6" fill="#1a7a6d" opacity="0.55"/>
  <circle cx="356" cy="107" r="6" fill="#1a7a6d" opacity="0.55"/>
  <circle cx="384" cy="107" r="6" fill="#1a7a6d" opacity="0.55"/>
  <!-- Tails -->
  <line x1="20" y1="113" x2="20" y2="123" stroke="#1a7a6d" stroke-width="1.5" opacity="0.35"/>
  <line x1="48" y1="113" x2="48" y2="123" stroke="#1a7a6d" stroke-width="1.5" opacity="0.35"/>
  <line x1="76" y1="113" x2="76" y2="123" stroke="#1a7a6d" stroke-width="1.5" opacity="0.35"/>
  <line x1="104" y1="113" x2="104" y2="123" stroke="#1a7a6d" stroke-width="1.5" opacity="0.35"/>
  <line x1="132" y1="113" x2="132" y2="123" stroke="#1a7a6d" stroke-width="1.5" opacity="0.35"/>
  <line x1="160" y1="113" x2="160" y2="123" stroke="#1a7a6d" stroke-width="1.5" opacity="0.35"/>
  <line x1="188" y1="113" x2="188" y2="123" stroke="#1a7a6d" stroke-width="1.5" opacity="0.35"/>
  <line x1="216" y1="113" x2="216" y2="123" stroke="#1a7a6d" stroke-width="1.5" opacity="0.35"/>
  <line x1="244" y1="113" x2="244" y2="123" stroke="#1a7a6d" stroke-width="1.5" opacity="0.35"/>
  <line x1="272" y1="113" x2="272" y2="123" stroke="#1a7a6d" stroke-width="1.5" opacity="0.35"/>
  <line x1="300" y1="113" x2="300" y2="123" stroke="#1a7a6d" stroke-width="1.5" opacity="0.35"/>
  <line x1="328" y1="113" x2="328" y2="123" stroke="#1a7a6d" stroke-width="1.5" opacity="0.35"/>
  <line x1="356" y1="113" x2="356" y2="123" stroke="#1a7a6d" stroke-width="1.5" opacity="0.35"/>
  <line x1="384" y1="113" x2="384" y2="123" stroke="#1a7a6d" stroke-width="1.5" opacity="0.35"/>
  <!-- Inner leaflet heads -->
  <circle cx="20" cy="130" r="6" fill="#1a7a6d" opacity="0.45"/>
  <circle cx="48" cy="130" r="6" fill="#1a7a6d" opacity="0.45"/>
  <circle cx="76" cy="130" r="6" fill="#1a7a6d" opacity="0.45"/>
  <circle cx="104" cy="130" r="6" fill="#1a7a6d" opacity="0.45"/>
  <circle cx="132" cy="130" r="6" fill="#1a7a6d" opacity="0.45"/>
  <circle cx="160" cy="130" r="6" fill="#1a7a6d" opacity="0.45"/>
  <circle cx="188" cy="130" r="6" fill="#1a7a6d" opacity="0.45"/>
  <circle cx="216" cy="130" r="6" fill="#1a7a6d" opacity="0.45"/>
  <circle cx="244" cy="130" r="6" fill="#1a7a6d" opacity="0.45"/>
  <circle cx="272" cy="130" r="6" fill="#1a7a6d" opacity="0.45"/>
  <circle cx="300" cy="130" r="6" fill="#1a7a6d" opacity="0.45"/>
  <circle cx="328" cy="130" r="6" fill="#1a7a6d" opacity="0.45"/>
  <circle cx="356" cy="130" r="6" fill="#1a7a6d" opacity="0.45"/>
  <circle cx="384" cy="130" r="6" fill="#1a7a6d" opacity="0.45"/>

  <!-- AMP 1: approaching horizontally -->
  <circle cx="75" cy="78" r="10" fill="#b45309" opacity="0.85"/>
  <circle cx="96" cy="73" r="10" fill="#b45309" opacity="0.85"/>
  <circle cx="117" cy="70" r="10" fill="#b45309" opacity="0.85"/>
  <circle cx="138" cy="68" r="10" fill="#b45309" opacity="0.85"/>
  <circle cx="159" cy="68" r="10" fill="#b45309" opacity="0.85"/>
  <line x1="85" y1="77" x2="86" y2="74" stroke="#555" stroke-width="1.5"/>
  <line x1="106" y1="72" x2="107" y2="71" stroke="#555" stroke-width="1.5"/>
  <line x1="127" y1="70" x2="128" y2="69" stroke="#555" stroke-width="1.5"/>
  <line x1="148" y1="68" x2="149" y2="68" stroke="#555" stroke-width="1.5"/>
  <!-- + charges -->
  <text x="75" y="82" font-family="Arial" font-size="8" fill="white" text-anchor="middle" font-weight="bold">+</text>
  <text x="117" y="74" font-family="Arial" font-size="8" fill="white" text-anchor="middle" font-weight="bold">+</text>
  <text x="159" y="72" font-family="Arial" font-size="8" fill="white" text-anchor="middle" font-weight="bold">+</text>
  <!-- Arrow pointing down toward membrane -->
  <line x1="165" y1="74" x2="175" y2="90" stroke="#b45309" stroke-width="2"/>
  <polygon points="172,88 179,97 177,86" fill="#b45309" opacity="0.8"/>

  <!-- AMP 2: inserting vertically into membrane -->
  <circle cx="300" cy="48" r="10" fill="#b45309" opacity="0.7"/>
  <circle cx="303" cy="64" r="10" fill="#b45309" opacity="0.8"/>
  <circle cx="301" cy="80" r="10" fill="#b45309" opacity="0.9"/>
  <circle cx="298" cy="96" r="10" fill="#b45309" opacity="1.0"/>
  <line x1="302" y1="58" x2="302" y2="54" stroke="#555" stroke-width="1.5"/>
  <line x1="302" y1="74" x2="301" y2="70" stroke="#555" stroke-width="1.5"/>
  <line x1="300" y1="90" x2="299" y2="86" stroke="#555" stroke-width="1.5"/>
  <text x="300" y="52" font-family="Arial" font-size="8" fill="white" text-anchor="middle" font-weight="bold">+</text>
  <text x="301" y="84" font-family="Arial" font-size="8" fill="white" text-anchor="middle" font-weight="bold">+</text>

  <!-- Label -->
  <text x="200" y="170" font-family="Georgia,serif" font-size="10" fill="#8a857c" text-anchor="middle">Selective membrane disruption by cationic AMPs</text>
</svg>
