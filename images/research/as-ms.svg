<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <rect width="400" height="200" fill="#f0ece4"/>

  <!-- Library of peptides (left cluster) -->
  <circle cx="42" cy="55" r="7" fill="#b45309" opacity="0.65"/>
  <circle cx="60" cy="44" r="7" fill="#1a7a6d" opacity="0.65"/>
  <circle cx="67" cy="64" r="7" fill="#b45309" opacity="0.5"/>
  <circle cx="44" cy="74" r="7" fill="#1a7a6d" opacity="0.5"/>
  <circle cx="63" cy="80" r="7" fill="#b45309" opacity="0.4"/>
  <circle cx="78" cy="55" r="7" fill="#1a7a6d" opacity="0.4"/>
  <circle cx="50" cy="92" r="7" fill="#1a7a6d" opacity="0.3"/>
  <circle cx="75" cy="88" r="7" fill="#b45309" opacity="0.3"/>
  <text x="58" y="115" font-family="Georgia,serif" font-size="9" fill="#8a857c" text-anchor="middle">Library</text>

  <!-- Arrow 1 -->
  <line x1="98" y1="72" x2="118" y2="72" stroke="#1a7a6d" stroke-width="1.5"/>
  <polygon points="118,68 127,72 118,76" fill="#1a7a6d"/>

  <!-- Target protein blob -->
  <ellipse cx="165" cy="72" rx="35" ry="28" fill="#1a7a6d" opacity="0.12" stroke="#1a7a6d" stroke-width="1.5"/>
  <path d="M143,65 Q155,48 175,60 Q188,70 172,82 Q158,92 143,82 Q133,75 143,65" fill="#1a7a6d" opacity="0.2"/>
  <!-- Binding pocket highlight -->
  <ellipse cx="163" cy="68" rx="12" ry="9" fill="#b45309" opacity="0.25"/>
  <!-- Bound bead -->
  <circle cx="162" cy="67" r="7" fill="#b45309" opacity="0.9"/>
  <circle cx="173" cy="63" r="7" fill="#1a7a6d" opacity="0.9"/>
  <text x="165" y="115" font-family="Georgia,serif" font-size="9" fill="#8a857c" text-anchor="middle">Target + selection</text>

  <!-- Arrow 2 -->
  <line x1="205" y1="72" x2="225" y2="72" stroke="#1a7a6d" stroke-width="1.5"/>
  <polygon points="225,68 234,72 225,76" fill="#1a7a6d"/>
  <text x="218" y="88" font-family="Georgia,serif" font-size="8" fill="#8a857c" text-anchor="middle">ESI-MS</text>

  <!-- Mass spectrum -->
  <line x1="248" y1="150" x2="390" y2="150" stroke="#8a857c" stroke-width="1.5"/>
  <line x1="248" y1="25" x2="248" y2="150" stroke="#8a857c" stroke-width="1.5"/>
  <rect x="263" y="136" width="9" height="14" fill="#1a7a6d" opacity="0.45"/>
  <rect x="280" y="118" width="9" height="32" fill="#1a7a6d" opacity="0.55"/>
  <rect x="297" y="82" width="9" height="68" fill="#b45309" opacity="0.9"/>
  <text x="301" y="78" font-family="Georgia,serif" font-size="8" fill="#b45309">★</text>
  <rect x="314" y="106" width="9" height="44" fill="#1a7a6d" opacity="0.65"/>
  <rect x="331" y="125" width="9" height="25" fill="#1a7a6d" opacity="0.5"/>
  <rect x="348" y="137" width="9" height="13" fill="#1a7a6d" opacity="0.35"/>
  <rect x="365" y="142" width="9" height="8" fill="#1a7a6d" opacity="0.25"/>
  <text x="320" y="170" font-family="Georgia,serif" font-size="9" fill="#8a857c" text-anchor="middle">m/z</text>

  <text x="200" y="191" font-family="Georgia,serif" font-size="10" fill="#8a857c" text-anchor="middle">Affinity selection + mass spectrometric identification</text>
</svg>
