<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <rect width="400" height="200" fill="#f0ece4"/>

  <!-- Liquid handler gantry frame -->
  <rect x="30" y="22" width="150" height="7" rx="3" fill="#1a7a6d" opacity="0.65"/>
  <rect x="31" y="29" width="4" height="70" fill="#8a857c" opacity="0.6"/>
  <rect x="175" y="29" width="4" height="70" fill="#8a857c" opacity="0.6"/>
  <!-- Moving arm -->
  <rect x="80" y="25" width="55" height="7" rx="2" fill="#1a7a6d"/>
  <!-- Pipette head + tip -->
  <rect x="102" y="32" width="10" height="5" rx="1" fill="#1a7a6d" opacity="0.8"/>
  <line x1="107" y1="37" x2="107" y2="57" stroke="#b45309" stroke-width="2"/>
  <polygon points="104,57 107,65 110,57" fill="#b45309" opacity="0.75"/>

  <!-- 96-well plate -->
  <rect x="32" y="103" width="148" height="72" rx="5" fill="white" stroke="#8a857c" stroke-width="1.5"/>
  <circle cx="60" cy="120" r="9" fill="#1a7a6d" opacity="0.25"/>
  <circle cx="87" cy="120" r="9" fill="#1a7a6d" opacity="0.45"/>
  <circle cx="114" cy="120" r="9" fill="#b45309" opacity="0.65"/>
  <circle cx="141" cy="120" r="9" fill="#b45309" opacity="0.85"/>
  <circle cx="60" cy="147" r="9" fill="#1a7a6d" opacity="0.35"/>
  <circle cx="87" cy="147" r="9" fill="#b45309" opacity="0.35"/>
  <circle cx="114" cy="147" r="9" fill="#b45309" opacity="0.55"/>
  <circle cx="141" cy="147" r="9" fill="#1a7a6d" opacity="0.75"/>

  <!-- Arrow -->
  <line x1="195" y1="110" x2="222" y2="110" stroke="#1a7a6d" stroke-width="2"/>
  <polygon points="222,106 232,110 222,114" fill="#1a7a6d"/>

  <!-- Peptide chain (amino acid beads) -->
  <circle cx="258" cy="90" r="14" fill="#1a7a6d" opacity="0.85"/>
  <circle cx="291" cy="86" r="14" fill="#b45309" opacity="0.85"/>
  <circle cx="324" cy="90" r="14" fill="#1a7a6d" opacity="0.85"/>
  <circle cx="355" cy="82" r="14" fill="#b45309" opacity="0.55" stroke="#b45309" stroke-dasharray="3,2" stroke-width="1.5"/>
  <line x1="272" y1="89" x2="277" y2="88" stroke="#555" stroke-width="1.5"/>
  <line x1="305" y1="88" x2="310" y2="89" stroke="#555" stroke-width="1.5"/>
  <line x1="337" y1="87" x2="341" y2="85" stroke="#555" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="258" y="94" font-family="Georgia,serif" font-size="9" fill="white" text-anchor="middle">R₁</text>
  <text x="291" y="90" font-family="Georgia,serif" font-size="9" fill="white" text-anchor="middle">R₂</text>
  <text x="324" y="94" font-family="Georgia,serif" font-size="9" fill="white" text-anchor="middle">R₃</text>

  <text x="200" y="188" font-family="Georgia,serif" font-size="10" fill="#8a857c" text-anchor="middle">Automated synthesis and functional screening</text>
</svg>
