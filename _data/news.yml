# News items.
# The 3 most recent are shown on the home page sidebar; all appear on /news/.
#
# Required fields:
#   date      — display string, e.g. "April 15, 2025"
#   headline  — short title (1 sentence)
#
# Optional fields:
#   description — 2–3 sentences of detail shown on the /news/ page
#   image       — path relative to images/, e.g. "news/paper-jacs-2025.jpg"
#   link        — URL to link the headline to (paper, press article, etc.)

- date: "January 1, 2025"
  headline: "Brown Lab website launched"
  description: "The Brown Lab at the University of Toronto has launched its new website. The site will feature lab news, publications, research highlights, and team information. Check back regularly for updates."

- date: "September 1, 2024"
  headline: "Brown Lab opens at the Leslie Dan Faculty of Pharmacy"
  description: "Joseph S. Brown joins the University of Toronto as an Assistant Professor in the Leslie Dan Faculty of Pharmacy. The lab will focus on self-driving laboratories for peptide drug discovery, combining automated chemistry with machine learning."
